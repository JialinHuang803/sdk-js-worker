name: Collect JS emitter

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages replaces the entire site. Serialize restoration, collection and publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --userconfig .npmrc.example
      - name: Preserve SDK snapshot and activity comparison window
        run: npm run data:restore
      - name: Collect public JS emitter issues, PRs and published version
        run: npm run collect:emitter
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npm run build
        env:
          VITE_ACTIVITY_API_URL: ${{ vars.ACTIVITY_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
