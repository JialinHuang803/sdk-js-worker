name: Collect JS emitter

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: collect-emitter
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'JialinHuang803/sdk-js-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --userconfig .npmrc.example
      - name: Collect and atomically publish JS emitter data to Azure
        run: npm run collect:emitter
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY_API_URL: ${{ vars.ACTIVITY_API_URL }}
          ACTIVITY_COLLECTOR_AUTH: github-oidc
