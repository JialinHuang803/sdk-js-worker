name: Collect Azure SDK dashboard

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      recover_holdon_comments:
        description: Recover the last 24 hours of HoldOn comments without resetting read state
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: collect-sdk
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'JialinHuang803/sdk-js-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --userconfig .npmrc.example
      - name: Collect and atomically publish Azure SDK data to Azure
        run: npm run collect
        env:
          GITHUB_TOKEN: ${{ secrets.AZURE_SDK_READ_TOKEN || github.token }}
          ACTIVITY_API_URL: ${{ vars.ACTIVITY_API_URL }}
          ACTIVITY_COLLECTOR_AUTH: github-oidc
          RECOVER_HOLDON_COMMENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_holdon_comments || false }}
