name: Collect and deploy dashboard

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --userconfig .npmrc.example
      - name: Collect public Azure SDK pull request data
        run: npm run collect
        env:
          GITHUB_TOKEN: ${{ secrets.AZURE_SDK_READ_TOKEN || github.token }}
          ACTIVITY_API_URL: ${{ vars.ACTIVITY_API_URL }}
          ACTIVITY_INGEST_KEY: ${{ secrets.ACTIVITY_INGEST_KEY }}
      - run: npm test
      - run: npm run build
        env:
          VITE_ACTIVITY_API_URL: ${{ vars.ACTIVITY_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
