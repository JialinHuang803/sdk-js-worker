name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --userconfig .npmrc.example
      - run: npm ci --prefix api --userconfig .npmrc.example
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm --prefix api run build
